name: kino-${KINO_ENV:-production}

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: 20m
    max-file: '5'

x-runtime-environment: &runtime-environment
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in the selected environment file}
  REDIS_URL: ${REDIS_URL:?set REDIS_URL in the selected environment file}
  JOB_QUEUE_PREFIX: ${JOB_QUEUE_PREFIX:-kino-jobs}
  S3_ENDPOINT: http://object-storage:9000
  S3_BUCKET: ${S3_BUCKET:-kino-media}
  S3_FIRMWARE_BUCKET: ${S3_FIRMWARE_BUCKET:-kino-firmware}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in the selected environment file}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in the selected environment file}
  S3_REGION: ${S3_REGION:-us-east-1}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in the selected environment file}
  COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET in the selected environment file}
  TRUST_PROXY: 'true'
  OBJECT_DELIVERY: proxy
  DEVICE_REGISTRATION_MODE: ${DEVICE_REGISTRATION_MODE:-first-write-wins}

services:
  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      KINO_SITE_ADDRESS: ${KINO_SITE_ADDRESS:?set KINO_SITE_ADDRESS in the selected environment file}
    ports:
      - '${KINO_HTTP_PORT:-80}:80'
      - '${KINO_HTTPS_PORT:-443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    security_opt: [no-new-privileges:true]
    logging: *json-logging

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: web
    restart: unless-stopped
    read_only: true
    tmpfs: [/config, /data]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8080/']
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]

  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: api
    command: ['./node_modules/.bin/tsx', 'apps/api/src/migrate.ts']
    environment: *runtime-environment
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      <<: *runtime-environment
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN in the selected environment file}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      createbucket: { condition: service_completed_successfully }
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]
    logging: *json-logging

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: worker
    restart: unless-stopped
    environment: *runtime-environment
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      createbucket: { condition: service_completed_successfully }
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    logging: *json-logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kino}
      POSTGRES_USER: ${POSTGRES_USER:-kino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the selected environment file}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: [no-new-privileges:true]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping']
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in the selected environment file}
    security_opt: [no-new-privileges:true]

  object-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in the selected environment file}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in the selected environment file}
      MINIO_PROMETHEUS_AUTH_TYPE: public
      S3_BUCKET: ${S3_BUCKET:-kino-media}
      S3_FIRMWARE_BUCKET: ${S3_FIRMWARE_BUCKET:-kino-firmware}
    volumes: [miniodata:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: [no-new-privileges:true]

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.11.1
    profiles: [observability]
    command: ['--path.rootfs=/host']
    pid: host
    volumes: ['/:/host:ro,rslave']
    read_only: true
    security_opt: [no-new-privileges:true]
    logging: *json-logging

  createbucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      object-storage: { condition: service_healthy }
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in the selected environment file}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in the selected environment file}
      S3_BUCKET: ${S3_BUCKET:-kino-media}
      S3_FIRMWARE_BUCKET: ${S3_FIRMWARE_BUCKET:-kino-firmware}
    entrypoint: >-
      /bin/sh -c 'mc alias set local http://object-storage:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" &&
      mc mb --ignore-existing local/"$${S3_BUCKET}" &&
      mc mb --ignore-existing local/"$${S3_FIRMWARE_BUCKET}"'
    security_opt: [no-new-privileges:true]

volumes:
  pgdata: {}
  redisdata: {}
  miniodata: {}
  caddy_data: {}
  caddy_config: {}
