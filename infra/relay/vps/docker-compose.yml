# The relay VPS: the public face of kino.acronym.sk while the KINO stack runs
# on the operator's PC. Two containers, no data.
#
#   cp .env.example .env   # RELAY_TOKEN (long random), KINO_SITE_ADDRESS
#   docker compose up -d
#
# Websupport DNS: kino.acronym.sk A -> this machine's static IPv4. Open only
# 80, 443 (Caddy, ACME) and 7000 (frps, token + TLS) in the VPS firewall.
# frps binds the tunnelled port on 127.0.0.1 only, so the PC's Caddy is never
# reachable except through this Caddy.
# Both containers cap their own logs. A VPS is usually the smallest disk in the
# deployment, and an frps that logs every reconnect of a PC on a domestic line
# is the thing that fills it.
x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: 20m
    max-file: '5'

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      KINO_SITE_ADDRESS: ${KINO_SITE_ADDRESS:?set KINO_SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt: [no-new-privileges:true]
    logging: *json-logging

  frps:
    image: snowdreamtech/frps:0.61.1
    restart: unless-stopped
    network_mode: host
    environment:
      RELAY_TOKEN: ${RELAY_TOKEN:?set RELAY_TOKEN}
    volumes:
      - ./frps.toml:/etc/frp/frps.toml:ro
    security_opt: [no-new-privileges:true]
    logging: *json-logging

volumes:
  caddy_data:
  caddy_config:
