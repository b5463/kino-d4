version = 1

[[annotations]]
path = [
  "*.md",
  "*.json",
  "*.toml",
  ".gitignore",
  # `.gitignore` was listed and its two siblings were not, so the repository's
  # own configuration files had no declared license while everything around
  # them did. The coverage walk in scripts/check-licenses.mjs is what found
  # them; before it, the check only asserted that a list of literal strings
  # appeared in this file, so a path matching no glob passed.
  ".gitattributes",
  ".dockerignore",
  ".npmrc",
  ".github/**",
  "apps/**",
  "packages/**",
  "infra/**",
  "firmware/**",
  "firmware-contract/**",
  "kino_dev_spec_pack/**",
  "kino_twin_spec/**",
  "docs/**",
  "hardware/**",
  "scripts/**",
  # The generator tools next to scripts/ (tools/mkbitmap.mjs, tools/mktext.mjs).
  # Same kind of file, same grant; they were simply never listed, which left
  # them with no declared license at all.
  "tools/**",
  "e2e/**",
  "playwright.config.ts",
  # One critique file is tracked even though `.gitignore` ignores
  # `.impeccable/` — gitignore does not apply to files already tracked, so the
  # rule there gives false confidence. Covered here because it IS in the tree
  # and had no declared license; whether it should be tracked at all is a
  # separate decision for whoever added it.
  ".impeccable/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 KINO contributors <https://github.com/b5463/kino-d4/graphs/contributors>"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
  "hardware/**",
  "docs/HARDWARE.md",
  "kino_twin_spec/component-manifest.json",
  "kino_twin_spec/SOURCES.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 KINO contributors <https://github.com/b5463/kino-d4/graphs/contributors>"
SPDX-License-Identifier = "CERN-OHL-S-2.0"

[[annotations]]
path = [
  "docs/assets/brand/**",
  "docs/assets/product/**",
  # The wordmarks the apps ship are trimmed, single-ink derivations of the
  # brand rasters. Same artwork, same reserved terms — the surrounding MIT
  # grant on apps/** must not swallow them.
  "apps/studio/src/assets/**",
  "apps/twin/src/assets/**",
  "apps/roll-web/src/assets/**",
  # prusa-print-98 arrived without these lines, so the apps/** MIT grant was
  # swallowing its wordmark exactly as the note above says it must not.
  "apps/prusa-print-98/assets/**",
  "apps/prusa-print-98/public/kino-print-logo.png",
  # The field body's lens cover carries the wordmark as a raised bitmap. The
  # trace it is built from is a derivation of the brand raster and stays under
  # these terms; the generator reads it at build time rather than embedding it
  # in CERN-OHL-S source.
  "hardware/cad/KINO_FIELD_BODY/brand/**",
  # The app icons are the D4 badge lifted out of the same wordmarks.
  "apps/studio/public/icon-*.png",
  "apps/twin/public/icon-*.png",
  "apps/roll-web/public/icon-*.png",
  "archive/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 KINO contributors <https://github.com/b5463/kino-d4/graphs/contributors>"
SPDX-License-Identifier = "LicenseRef-KINO-Reserved"

# The D4 menu icons are Windows 98 shell icons, baked at native size by
# scripts/bake-w98-icons.mjs. firmware/** is declared MIT three blocks up, which
# would relabel Microsoft's artwork as ours to give away. It is not, and this
# override says so. The annotation records the ownership; it grants nothing.
# See LICENSES/LicenseRef-Microsoft-Proprietary.txt and THIRD_PARTY_NOTICES.md.
[[annotations]]
path = ["firmware/p4/main/icons_w98.h"]
precedence = "override"
SPDX-FileCopyrightText = "Microsoft Corporation"
SPDX-License-Identifier = "LicenseRef-Microsoft-Proprietary"

# W95FA, the typeface KINO Print's Windows 98 styling is set in. Alina Sava's
# recreation, under the SIL Open Font License 1.1 - and unlike the traced
# Roboto outlines below, the font software itself IS shipped, in the app's
# bundle and in its packaged build. apps/** is MIT one block above, so without
# this override the app would relabel someone else's font as ours. The OFL
# permits bundling; what it does not permit is dropping the notice, so the
# notice and the licence text travel with the file.
[[annotations]]
path = [
  "apps/prusa-print-98/public/fonts/w95fa.woff2",
  "apps/prusa-print-98/public/fonts/W95FA-OFL.txt",
  "apps/prusa-print-98/public/fonts/W95FA-NOTICE.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "Alina Sava"
SPDX-License-Identifier = "OFL-1.1"

# The field body's engraved revision and serial are set in Roboto Regular,
# traced to outlines by hardware/cad/KINO_FIELD_BODY/fonts/trace-font.py from
# the installed font. The traced outlines are a derivative of the typeface and
# keep its Apache-2.0 terms; no font software is shipped. hardware/** is
# declared CERN-OHL-S above, which would relabel Google's glyphs as ours.
[[annotations]]
path = ["hardware/cad/KINO_FIELD_BODY/fonts/*.json"]
precedence = "override"
SPDX-FileCopyrightText = "2011 Google Inc. (Roboto, by Christian Robertson)"
SPDX-License-Identifier = "Apache-2.0"

# The C6 coprocessor partition table is Espressif's, vendored verbatim from
# espressif/esp_hosted 3.0.6 (examples/mcu_hosted_sdio_sdmmc_combined/cp/).
# It is copied rather than referenced because IDF resolves
# CONFIG_PARTITION_TABLE_CUSTOM_FILENAME against the project directory and
# managed_components/ is generated, not committed. firmware/** is declared MIT
# four blocks up, which would relabel Espressif's file as ours; this override
# says whose it is. The annotation records ownership; it grants nothing.
[[annotations]]
path = ["firmware/c6/partitions_eh_cp_ota_4m.csv"]
precedence = "override"
SPDX-FileCopyrightText = "2021-2025 Espressif Systems (Shanghai) CO LTD"
SPDX-License-Identifier = "Apache-2.0"
