<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <!--
      03§9: rolls are unlisted by default and never belong in a search index.
      This app is entirely guest (/r/*) and host (/host) surface — nothing
      here is meant to be crawled — so the tag is unconditional on the one
      HTML shell rather than something a route would have to remember to add.
      The API sets the equivalent `X-Robots-Tag` header on every response
      under `/api/rolls/` (see `rolls/robots.ts`); this is that same rule for
      the page itself.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>KINO Roll</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
