name: firmware
# The contract and the normative TS protocol are firmware inputs — a
# renumber in packages/kdp must rebuild and re-test firmware (issue #90).
on:
  push:
    branches: [main]
    paths:
      [
        'firmware/**',
        'firmware-contract/**',
        'packages/kdp/**',
        'scripts/firmware-daemon.mjs',
        'scripts/check-versions.mjs',
        '.github/workflows/firmware.yml',
      ]
  pull_request:
    paths:
      [
        'firmware/**',
        'firmware-contract/**',
        'packages/kdp/**',
        'scripts/firmware-daemon.mjs',
        'scripts/check-versions.mjs',
        '.github/workflows/firmware.yml',
      ]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Portable KDP framing: CRC-32, encoder, stream decoder.
      - run: make -C firmware/components/kdp_core/host_tests test
      # The P4's own arithmetic and string logic (firmware/p4/main/pure.c).
      # Both defects this firmware has shipped were in functions of this shape
      # and neither needed hardware to catch. No dependencies, so it runs here
      # rather than in the IDF container.
      - run: make -C firmware/p4/host_tests test
      # The Roll upload queue: resume after reboot, bounded retry, response
      # classification, redaction, and the 50-captures-offline acceptance
      # scenario. No radio has ever been exercised on this hardware
      # (firmware/C6_HARDWARE_MAP.md), so this is currently the ONLY evidence
      # any of the queue behaves — which is why it is a required check and not
      # an optional one.
      - run: make -C firmware/p4/host_tests test-queue
      # The C6 link state model and the Wi-Fi credential rules. Asserts the
      # two things that are easy to get wrong and expensive to find on a
      # bench: that "fitted" is reported separately from "routed", and that
      # association alone is never reported as connected.
      - run: make -C firmware/p4/host_tests test-net
      # The same state machine with a radio driver registered, which is what
      # the radio build runs. net_hosted.c itself cannot be host-tested — it is
      # esp_hosted and esp_wifi calls — so this is the only place the version
      # gate refusing without claiming the chip is absent, an address clearing
      # when the association drops, and LINK_READY not being `connected` are
      # checked at all.
      - run: make -C firmware/p4/host_tests test-report
      # The QR encoder for the Roll join code, checked module-for-module
      # against matrices generated by the `qrcode` npm package. A QR with one
      # wrong module looks correct on the panel and scans on no phone, and
      # nothing on the device can tell — so this is the only place that
      # failure is catchable.
      - run: make -C firmware/p4/host_tests test-qr
      # The JP1 pin map: eight unique camera GPIOs, SYNC_OUT apart from them,
      # every one on a header pin that exists, none on a peripheral the board
      # already uses. GPIO52/51 is the measured CAM1 pair; an earlier map,
      # copied from the JC-ESP32P4-M3-DEV carrier, put CAM1 on GPIO1/GPIO2,
      # which reach nothing here and cost a bench session. This is what stops
      # that happening twice.
      - run: make -C firmware/p4/host_tests test-pins
      # When a hardware-validation row may be marked. Required, not optional:
      # the C6 rows were nearly wired to esp_hosted_init()'s return value,
      # which returns 0 on this board with nothing on the SDIO bus. That would
      # have recorded a validated radio transport on a camera whose radio has
      # never enumerated, and the registry is what the project consults to
      # answer "has this ever actually worked". Mostly negative tests: the
      # states that look enough like success to be marked.
      - run: make -C firmware/p4/host_tests test-hwv
      # The bench-only C6 reset request: one pulse when built in, nothing
      # otherwise, never a P4 restart.
      - run: make -C firmware/p4/host_tests test-bench
      # What the P4 does when the C6 goes away under a live link: bounded,
      # backed off, generation-guarded, never a P4 reboot.
      - run: make -C firmware/p4/host_tests test-recovery

  host-preview:
    # The native UI renderer. It compiles ui.c as a translation unit, so a
    # change that breaks the drawing code fails here rather than being found
    # by eye on a board — which is how three visual defects were found in its
    # first run. Previously unguarded by CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the renderer
        run: make -C firmware/p4/host_preview
      - name: Render every screen
        run: |
          mkdir -p /tmp/preview
          ./firmware/p4/host_preview/preview /tmp/preview
          # A renderer that builds but draws nothing is a pass we do not want.
          count=$(ls /tmp/preview/*.ppm 2>/dev/null | wc -l)
          echo "rendered $count screens"
          if [ "$count" -lt 10 ]; then
            echo "::error::expected at least 10 rendered screens, got $count"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-screens
          path: /tmp/preview/*.ppm
          retention-days: 7

  idf-build:
    strategy:
      matrix:
        # c6 is the radio coprocessor's hosted-slave image. It is built and
        # size-checked here even though the P4 cannot talk to it yet: the C6's
        # SDIO slave pins are fixed in silicon, so the slave image is correct
        # independently of the carrier routing that is still unknown. Building
        # it now is what stops it rotting until the schematic arrives.
        app: [p4, camnode, uvc-preview, c6]
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build ${{ matrix.app }}
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd "firmware/${{ matrix.app }}"
          idf.py build

      # META.JSON generation, the META -> CaptureSummary mapping and config
      # migration. Compiled against ESP-IDF's OWN cJSON rather than a vendored
      # copy, so the mapping is tested against the same parser the device
      # links - which is why this runs here and not in the host-tests job.
      # Two of the three mappings have already shipped a defect.
      - name: P4 JSON mapping tests
        if: matrix.app == 'p4'
        shell: bash
        run: make -C firmware/p4/host_tests test-meta

      # The UPLOAD.JSON record: round-trip, a corrupted record, a future format
      # version. Here rather than in the host-tests job for the same reason as
      # above - it needs the container's cJSON, because a record read back
      # through a different parser than the device uses proves nothing.
      - name: P4 upload record tests
        if: matrix.app == 'p4'
        shell: bash
        run: make -C firmware/p4/host_tests test-store

      # ---- firmware size guard (P4 only) ----
      #
      # Detects accidental major growth, nothing more. This is NOT a size
      # optimisation target and the current binary is not near it.
      #
      # Re-derived for firmware/p4/partitions.csv (issue #143). The ceiling is
      # ota_0, not the old `factory` slot:
      #
      #   ota_0 (partitions.csv):  3072 KB
      #   measured, 0.4.9:          864 KB  (0x0d8110) - was 842 KB before
      #                                     CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH
      #                                     added ~21 KB
      #   limit below:             1200 KB  = measured + 336 KB slack (39%),
      #                                       39% of the slot
      #
      # 336 KB is slack, not headroom: this build has no pending feature that
      # needs it. Crossing it means something grew by a third without anyone
      # noticing, which is worth one line in a PR. There is 1872 KB of ota_0
      # still free at the limit, so raising the number is cheap - say why.
      #
      # The app offset did NOT change: ota_0 starts at 0x10000, the same place
      # the old `factory` partition did. A kino-p4.bin built from any commit
      # before the repartition still flashes and boots at 0x10000 - this
      # workflow keeps no binary artifacts, so that image comes from a local
      # build of the older commit, not from CI. What did change:
      # the build now emits a fourth image, ota_data_initial.bin at 0xa000, and
      # a unit that gets the new partition table without it boots off whatever
      # bytes are already at 0xa000. build/flash_args carries all four.
      - name: Guard firmware size
        if: matrix.app == 'p4'
        shell: bash
        run: |
          LIMIT_KB=1200
          BIN=firmware/p4/build/kino-p4.bin
          SIZE_B=$(stat -c %s "$BIN")
          SIZE_KB=$((SIZE_B / 1024))
          echo "kino-p4.bin: ${SIZE_KB} KB (limit ${LIMIT_KB} KB)"
          echo "### Firmware size: ${SIZE_KB} KB / ${LIMIT_KB} KB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE_KB" -gt "$LIMIT_KB" ]; then
            echo "::error::kino-p4.bin grew to ${SIZE_KB} KB, over the ${LIMIT_KB} KB guard."
            echo "::error::If the growth is intended, raise LIMIT_KB in this workflow and say why."
            exit 1
          fi

  p4-radio:
    # The C6 radio variant, so it cannot rot.
    #
    # Off in the default build and this is the only thing that builds it. The
    # gate is a safety control, not a preference: enabling ESP-Hosted drives
    # GPIO14-19 and GPIO54 toward the C6 on every boot, and the Guition
    # carrier's routing is corroborated but not bench-proven
    # (firmware/C6_HARDWARE_MAP.md). Nothing here has been flashed or powered.
    #
    # A separate job rather than a matrix row on idf-build: it needs a different
    # build command, a different size guard, and it must be possible to read at
    # a glance which of the two binaries a size number belongs to.
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build p4 with the radio
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware/p4
          idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.radio" build

      # ---- radio-variant size guard ----
      #
      # Its own number, and the default P4 guard stays at 1200 KB. Sharing one
      # limit would mean either letting the default binary grow 400 KB
      # unnoticed or failing the radio build on arrival.
      #
      #   measured, 0.4.6:        1384 KB   (0x15a030)
      #   measured, 0.4.8:        1451 KB   (0x16aa90) - looks and sounds added ~67 KB
      #   measured, 0.4.9:        1472 KB   (0x1702b0) - coredump-to-flash added ~21 KB
      #   ota_0 (partitions.csv): 3072 KB
      #   limit below:            1600 KB   = measured + 128 KB slack (8.7%)
      #
      # The repartition (issue #143) landed, so the wall moved: at the 1600 KB
      # limit ota_0 is still 1472 KB free - the guard is a review trigger now,
      # not a physical ceiling. 128 KB is about two features' worth at the rate
      # this variant has been growing (67 KB for looks and sounds, 21 KB for
      # coredump); crossing it should be a deliberate edit with a sentence
      # attached, not a surprise on the bench.
      #
      # The stack is the size it is: ESP-Hosted, esp_wifi_remote, lwIP, mbedTLS
      # and an HTTP client add ~608 KB over the default build. Two consequences
      # worth stating rather than discovering:
      #
      #   - the CMN certificate bundle is no longer load-bearing for size. FULL
      #     measured 1434 KB against the old 1500 KB slot; against 3072 KB it
      #     fits. It stays CMN for the trust-surface reason. See sdkconfig.radio.
      #   - both OTA slots are sized for THIS binary, not the default one. An
      #     OTA writes into whichever slot is not running, so the radio image is
      #     what set 3 MB.
      - name: Guard radio firmware size
        shell: bash
        run: |
          LIMIT_KB=1600
          BIN=firmware/p4/build/kino-p4.bin
          SIZE_B=$(stat -c %s "$BIN")
          SIZE_KB=$((SIZE_B / 1024))
          echo "kino-p4.bin (radio): ${SIZE_KB} KB (limit ${LIMIT_KB} KB)"
          echo "### Radio firmware size: ${SIZE_KB} KB / ${LIMIT_KB} KB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE_KB" -gt "$LIMIT_KB" ]; then
            echo "::error::radio kino-p4.bin grew to ${SIZE_KB} KB, over the ${LIMIT_KB} KB guard."
            echo "::error::ota_0 is 3072 KB, so this is a review trigger, not a wall."
            echo "::error::Raise LIMIT_KB in this workflow and say what grew and why."
            exit 1
          fi

  reproducible:
    # Two clean builds of one commit must make the same binary.
    #
    # `CONFIG_APP_REPRODUCIBLE_BUILD=y` has been set in both projects and the
    # property was checked by hand once (commit a9fb461), but nothing enforced
    # it afterwards. An unpinned dependency or a timestamp leaking into the
    # image breaks it silently, and the first place that hurts is a firmware
    # update whose hash does not match what was published.
    #
    # Deliberately a separate job: it builds twice, so it is the slowest thing
    # here and should not gate the ordinary build matrix.
    strategy:
      matrix:
        app: [p4, c6]
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build ${{ matrix.app }} twice and compare
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          cd "firmware/${{ matrix.app }}"
          BIN="build/kino-${{ matrix.app }}.bin"

          idf.py build >/dev/null
          FIRST=$(sha256sum "$BIN" | cut -d' ' -f1)

          # A full clean, not `idf.py clean`: the point is to rebuild from
          # nothing, the way a release build or another machine would.
          rm -rf build
          idf.py build >/dev/null
          SECOND=$(sha256sum "$BIN" | cut -d' ' -f1)

          echo "first:  $FIRST"
          echo "second: $SECOND"
          {
            echo "### ${{ matrix.app }} reproducibility"
            echo ""
            echo "- first:  \`$FIRST\`"
            echo "- second: \`$SECOND\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FIRST" != "$SECOND" ]; then
            echo "::error::two clean builds of ${{ matrix.app }} produced different binaries."
            echo "::error::something non-deterministic reached the image — a timestamp, a path, or an unpinned dependency."
            exit 1
          fi
          echo "reproducible: ${FIRST}"
