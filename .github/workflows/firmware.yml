name: firmware
# The contract and the normative TS protocol are firmware inputs — a
# renumber in packages/kdp must rebuild and re-test firmware (issue #90).
on:
  push:
    branches: [main]
    paths:
      [
        'firmware/**',
        'firmware-contract/**',
        'packages/kdp/**',
        'scripts/firmware-daemon.mjs',
        'scripts/check-versions.mjs',
        '.github/workflows/firmware.yml',
      ]
  pull_request:
    paths:
      [
        'firmware/**',
        'firmware-contract/**',
        'packages/kdp/**',
        'scripts/firmware-daemon.mjs',
        'scripts/check-versions.mjs',
        '.github/workflows/firmware.yml',
      ]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Portable KDP framing: CRC-32, encoder, stream decoder.
      - run: make -C firmware/components/kdp_core/host_tests test
      # The P4's own arithmetic and string logic (firmware/p4/main/pure.c).
      # Both defects this firmware has shipped were in functions of this shape
      # and neither needed hardware to catch. No dependencies, so it runs here
      # rather than in the IDF container.
      - run: make -C firmware/p4/host_tests test
      # The Roll upload queue: resume after reboot, bounded retry, response
      # classification, redaction, and the 50-captures-offline acceptance
      # scenario. No radio has ever been exercised on this hardware
      # (firmware/C6_HARDWARE_MAP.md), so this is currently the ONLY evidence
      # any of the queue behaves — which is why it is a required check and not
      # an optional one.
      - run: make -C firmware/p4/host_tests test-queue
      # The C6 link state model and the Wi-Fi credential rules. Asserts the
      # two things that are easy to get wrong and expensive to find on a
      # bench: that "fitted" is reported separately from "routed", and that
      # association alone is never reported as connected.
      - run: make -C firmware/p4/host_tests test-net
      # The QR encoder for the Roll join code, checked module-for-module
      # against matrices generated by the `qrcode` npm package. A QR with one
      # wrong module looks correct on the panel and scans on no phone, and
      # nothing on the device can tell — so this is the only place that
      # failure is catchable.
      - run: make -C firmware/p4/host_tests test-qr

  host-preview:
    # The native UI renderer. It compiles ui.c as a translation unit, so a
    # change that breaks the drawing code fails here rather than being found
    # by eye on a board — which is how three visual defects were found in its
    # first run. Previously unguarded by CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the renderer
        run: make -C firmware/p4/host_preview
      - name: Render every screen
        run: |
          mkdir -p /tmp/preview
          ./firmware/p4/host_preview/preview /tmp/preview
          # A renderer that builds but draws nothing is a pass we do not want.
          count=$(ls /tmp/preview/*.ppm 2>/dev/null | wc -l)
          echo "rendered $count screens"
          if [ "$count" -lt 10 ]; then
            echo "::error::expected at least 10 rendered screens, got $count"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-screens
          path: /tmp/preview/*.ppm
          retention-days: 7

  idf-build:
    strategy:
      matrix:
        # c6 is the radio coprocessor's hosted-slave image. It is built and
        # size-checked here even though the P4 cannot talk to it yet: the C6's
        # SDIO slave pins are fixed in silicon, so the slave image is correct
        # independently of the carrier routing that is still unknown. Building
        # it now is what stops it rotting until the schematic arrives.
        app: [p4, camnode, uvc-preview, c6]
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build ${{ matrix.app }}
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd "firmware/${{ matrix.app }}"
          idf.py build

      # META.JSON generation, the META -> CaptureSummary mapping and config
      # migration. Compiled against ESP-IDF's OWN cJSON rather than a vendored
      # copy, so the mapping is tested against the same parser the device
      # links - which is why this runs here and not in the host-tests job.
      # Two of the three mappings have already shipped a defect.
      - name: P4 JSON mapping tests
        if: matrix.app == 'p4'
        shell: bash
        run: make -C firmware/p4/host_tests test-meta

      # The UPLOAD.JSON record: round-trip, a corrupted record, a future format
      # version. Here rather than in the host-tests job for the same reason as
      # above - it needs the container's cJSON, because a record read back
      # through a different parser than the device uses proves nothing.
      - name: P4 upload record tests
        if: matrix.app == 'p4'
        shell: bash
        run: make -C firmware/p4/host_tests test-store

      # ---- firmware size guard (P4 only) ----
      #
      # Detects accidental major growth, nothing more. This is NOT a size
      # optimisation target and the current binary is not near it.
      #
      #   at time of writing:  ~786 KB
      #   factory partition:   1500 KB  (CONFIG_PARTITION_TABLE_SINGLE_APP_LARGE)
      #   limit below:         1100 KB  (~40% headroom over current)
      #
      # !! REVISIT WHEN M8 REPARTITIONS !!  The roadmap replaces the single
      # `factory` slot with two OTA slots, at which point the ceiling is the
      # new slot size and this number is wrong. See firmware/FIRMWARE_ROADMAP.md
      # M8 and the partition discussion there.
      - name: Guard firmware size
        if: matrix.app == 'p4'
        shell: bash
        run: |
          LIMIT_KB=1100
          BIN=firmware/p4/build/kino-p4.bin
          SIZE_B=$(stat -c %s "$BIN")
          SIZE_KB=$((SIZE_B / 1024))
          echo "kino-p4.bin: ${SIZE_KB} KB (limit ${LIMIT_KB} KB)"
          echo "### Firmware size: ${SIZE_KB} KB / ${LIMIT_KB} KB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE_KB" -gt "$LIMIT_KB" ]; then
            echo "::error::kino-p4.bin grew to ${SIZE_KB} KB, over the ${LIMIT_KB} KB guard."
            echo "::error::If the growth is intended, raise LIMIT_KB in this workflow and say why."
            exit 1
          fi

  reproducible:
    # Two clean builds of one commit must make the same binary.
    #
    # `CONFIG_APP_REPRODUCIBLE_BUILD=y` has been set in both projects and the
    # property was checked by hand once (commit a9fb461), but nothing enforced
    # it afterwards. An unpinned dependency or a timestamp leaking into the
    # image breaks it silently, and the first place that hurts is a firmware
    # update whose hash does not match what was published.
    #
    # Deliberately a separate job: it builds twice, so it is the slowest thing
    # here and should not gate the ordinary build matrix.
    strategy:
      matrix:
        app: [p4, c6]
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build ${{ matrix.app }} twice and compare
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          cd "firmware/${{ matrix.app }}"
          BIN="build/kino-${{ matrix.app }}.bin"

          idf.py build >/dev/null
          FIRST=$(sha256sum "$BIN" | cut -d' ' -f1)

          # A full clean, not `idf.py clean`: the point is to rebuild from
          # nothing, the way a release build or another machine would.
          rm -rf build
          idf.py build >/dev/null
          SECOND=$(sha256sum "$BIN" | cut -d' ' -f1)

          echo "first:  $FIRST"
          echo "second: $SECOND"
          {
            echo "### ${{ matrix.app }} reproducibility"
            echo ""
            echo "- first:  \`$FIRST\`"
            echo "- second: \`$SECOND\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FIRST" != "$SECOND" ]; then
            echo "::error::two clean builds of ${{ matrix.app }} produced different binaries."
            echo "::error::something non-deterministic reached the image — a timestamp, a path, or an unpinned dependency."
            exit 1
          fi
          echo "reproducible: ${FIRST}"
