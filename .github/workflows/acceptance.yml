name: acceptance
# The KINO Twin acceptance walk (apps/twin/README.md), driven by Playwright
# against the built Studio + Twin served from one origin. Only runs when the
# applications, the shared packages, or the harness itself change.
on:
  push:
    branches: [main]
    paths:
      - 'apps/twin/**'
      - 'apps/studio/**'
      - 'packages/**'
      - 'e2e/**'
      - 'playwright.config.*'
      - '.github/workflows/acceptance.yml'
  pull_request:
    paths:
      - 'apps/twin/**'
      - 'apps/studio/**'
      - 'packages/**'
      - 'e2e/**'
      - 'playwright.config.*'
      - '.github/workflows/acceptance.yml'
jobs:
  twin-walk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      # The walk drives the built dists, so they must be this commit's.
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
