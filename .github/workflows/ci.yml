name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      # service-free suites; add new workspaces here
      - run: npm run test -w @kino/studio -w @kino/kdp -w @kino/schemas -w @kino/test-fixtures
      - run: npm run build

  api-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kino
          POSTGRES_PASSWORD: kino
          POSTGRES_DB: kino
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kino -d kino"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # GitHub `services:` cannot pass a container command, and minio/minio
      # needs `server /data`. bitnami/minio starts the server by default and
      # creates MINIO_DEFAULT_BUCKETS on boot, replacing the compose file's
      # `createbucket` sidecar.
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: kino
          MINIO_ROOT_PASSWORD: kino-secret
          MINIO_DEFAULT_BUCKETS: kino-media,kino-firmware
        ports: ['9000:9000', '9001:9001']
        # Deliberately no `options:` health check. curl is not guaranteed to
        # exist inside this image, and a health-cmd that cannot run aborts
        # container initialisation (~150 s) before any step executes — which
        # would kill the job without ever reaching the wait step below. That
        # runner-side step is the single readiness gate.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # The readiness gate for MinIO. Probes the bucket rather than
      # /minio/health/live, because healthz calls HeadBucket and
      # MINIO_DEFAULT_BUCKETS is created asynchronously after MinIO reports
      # live — liveness alone would still race. Anonymous GET of an existing
      # bucket answers 403 (listing denied) or 200; a missing one answers 404.
      - name: Wait for MinIO bucket
        run: |
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9000/kino-media || true)
            if [ "$code" = "403" ] || [ "$code" = "200" ]; then
              echo "minio ready, bucket kino-media exists (HTTP $code)"; exit 0
            fi
            sleep 2
          done
          echo "minio bucket kino-media did not become ready in time (last HTTP $code)" >&2
          exit 1
      - run: npm run test -w @kino/api
        env:
          # Inside the Actions service network the standard ports are free.
          DATABASE_URL: postgres://kino:kino@localhost:5432/kino
          REDIS_URL: redis://localhost:6379
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: kino-media
          S3_ACCESS_KEY: kino
          S3_SECRET_KEY: kino-secret
          PUBLIC_BASE_URL: https://kino.acronym.sk
