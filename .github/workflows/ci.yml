name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run version:check
      - run: npm run license:check
      - run: npm run copy:check
      - run: npm run twin:body:check
      - run: npm run lint
      # service-free suites; add new workspaces here
      - run: npm run test -w @kino/studio -w @kino/kdp -w @kino/schemas -w @kino/test-fixtures -w @kino/hardware-profiles -w @kino/simulator-engine -w @kino/three-assets -w @kino/twin -w @kino/design-system -w @kino/media -w @kino/roll-web
      - run: npm run build

  api-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kino
          POSTGRES_PASSWORD: kino
          POSTGRES_DB: kino
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kino -d kino"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # MinIO built from its source at the pinned release tag, not pulled as an
      # image. Docker Hub and then quay.io both started refusing this exact tag
      # (`unauthorized`, #240): MinIO no longer serves free community images.
      # Building the tag keeps the server and version under test unchanged and
      # depends on no registry but Docker Hub's official golang image.
      # Measured: about 75 s to build, ready about 2 s after start.
      - name: Build pinned MinIO
        env:
          MINIO_TAG: RELEASE.2025-04-22T22-12-26Z
        run: |
          docker run --rm -v "$RUNNER_TEMP:/out" -e MINIO_TAG golang:1.24 sh -ec '
            git clone --quiet --depth 1 --branch "$MINIO_TAG" https://github.com/minio/minio.git /src
            cd /src
            CGO_ENABLED=0 go build -trimpath -o /out/minio .'
          "$RUNNER_TEMP/minio" --version
      - name: Start pinned MinIO
        run: |
          generated_secret="$(openssl rand -hex 24)"
          echo "::add-mask::$generated_secret"
          export MINIO_ROOT_PASSWORD="$generated_secret"
          {
            echo "MINIO_ROOT_PASSWORD=$generated_secret"
            echo "AWS_SECRET_ACCESS_KEY=$generated_secret"
            echo "S3_SECRET_KEY=$generated_secret"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/minio-data"
          MINIO_ROOT_USER=kino nohup "$RUNNER_TEMP/minio" server "$RUNNER_TEMP/minio-data" \
            --address :9000 --console-address :9001 > "$RUNNER_TEMP/minio.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/minio.pid"
      # The readiness gate for MinIO, and a real existence check for the bucket.
      #
      # `s3api head-bucket` signs with the root credentials and exits non-zero
      # unless the bucket exists AND is reachable with them — the same HeadBucket
      # call /api/healthz makes. An HTTP probe cannot substitute: MinIO evaluates
      # policy before existence, so an anonymous GET answers 403 for a MISSING
      # bucket exactly as it does for an existing one (measured against the dev
      # stack: both return 403). Such a probe is a liveness check wearing a
      # bucket-check label.
      #
      # The AWS CLI is preinstalled on ubuntu-latest runners.
      - name: Wait for MinIO bucket kino-media
        env:
          AWS_ACCESS_KEY_ID: kino
          # The runner has no ~/.aws/config, so the region must come from the
          # environment. MinIO ignores it, but SigV4 needs one to sign.
          AWS_DEFAULT_REGION: us-east-1
          # The loop below is the only retry layer. Without this the CLI would
          # retry internally as well, multiplying the per-call timeouts.
          AWS_MAX_ATTEMPTS: '1'
        run: |
          # MinIO serves path-style. Pin it instead of relying on the CLI's
          # `auto` heuristic, which may rewrite the request to the virtual-host
          # name kino-media.localhost — a name the runner cannot resolve.
          aws configure set default.s3.addressing_style path
          ready() {
            aws --endpoint-url http://localhost:9000 \
                --cli-connect-timeout 2 --cli-read-timeout 5 \
                s3api list-buckets
          }
          # 60 iterations of (<=7 s probe + 2 s sleep) — ~9 min worst case.
          for _ in $(seq 1 60); do
            ready >/dev/null 2>&1 && break
            sleep 2
          done
          ready >/dev/null
          aws --endpoint-url http://localhost:9000 s3api create-bucket --bucket kino-media
          aws --endpoint-url http://localhost:9000 s3api create-bucket --bucket kino-firmware
          aws --endpoint-url http://localhost:9000 s3api head-bucket --bucket kino-media
          echo "head-bucket succeeded: kino-media exists and is readable"
      # The route tests hit real tables through `app.db`, so the CI database
      # must carry the committed migrations before they run. (`db.test.ts`
      # migrates its own throwaway `kino_test` database and is unaffected —
      # this step is for every other suite.) The postgres service has a
      # health check, so it is ready by the time this executes.
      - name: Apply database migrations
        run: npm run db:migrate -w @kino/api
        env:
          DATABASE_URL: postgres://kino:kino@localhost:5432/kino
      - run: npm run test -w @kino/api
        env:
          # Inside the Actions service network the standard ports are free.
          DATABASE_URL: postgres://kino:kino@localhost:5432/kino
          REDIS_URL: redis://localhost:6379
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: kino-media
          S3_ACCESS_KEY: kino
          PUBLIC_BASE_URL: https://kino.acronym.sk
      # The worker's suite needs the same three services and the same migrated
      # database, so it runs in this job rather than the service-free one. After
      # the API's, not before: these two write to the same tables, and a failure
      # here should be readable as the worker's own.
      - run: npm run test -w @kino/worker
        env:
          DATABASE_URL: postgres://kino:kino@localhost:5432/kino
          REDIS_URL: redis://localhost:6379
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: kino-media
          S3_ACCESS_KEY: kino
      - name: Stop MinIO
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/minio.pid" 2>/dev/null)" 2>/dev/null || true
          tail -n 20 "$RUNNER_TEMP/minio.log" 2>/dev/null || true
