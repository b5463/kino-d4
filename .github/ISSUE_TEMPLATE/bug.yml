name: Software bug
description: Report a repeatable Studio, KDP, schema, API, or test failure.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Security failures belong in a private security advisory. Remove tokens, roll PINs, serial numbers, private photographs, and location data.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - KINO Studio
        - KINO Device Protocol
        - Portable schemas
        - KINO API
        - Test fixtures
        - Documentation
        - Build or CI
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened?
      description: State the observed result and the result you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the shortest repeatable sequence.
      placeholder: |
        1. Start Studio at commit...
        2. Open the demo device...
        3. Select...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Studio 0.9.0, commit abc1234
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Chrome 140, Node.js 22
    validations:
      required: true
  - type: dropdown
    id: demo
    attributes:
      label: Does the demo device reproduce it?
      options:
        - "Yes"
        - "No"
        - Not tested
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or evidence
      description: Paste the smallest useful excerpt or attach a focused screenshot.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, tokens, roll PINs, serial numbers, private media, and location data.
          required: true
